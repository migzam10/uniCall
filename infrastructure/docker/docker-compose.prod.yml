services:
  db:
    image: postgres:16-alpine
    container_name: lsc_db
    restart: unless-stopped
    env_file:
      - ../../backend/.env
    environment:
      POSTGRES_USER: lsc_user
      POSTGRES_DB: lsc_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lsc_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lsc_user -d lsc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: lsc_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../../backend/.env
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - lsc_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/docs')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  lsc_db_data:
  lsc_storage:
