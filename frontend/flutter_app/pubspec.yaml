name: lsc_videollamadas
description: >
  Plataforma de videollamadas accesibles con traducción de Lengua de Señas
  Colombiana (LSC). Multiplataforma: Android, iOS y Web.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.5.1

  # Red / API
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1
  web_socket_channel: ^3.0.1

  # WebRTC (videollamadas)
  flutter_webrtc: ^0.11.7

  # Voz: grabación (STT) y reproducción (TTS)
  record: ^5.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

  # Panel administrativo: selección de archivos de video
  file_picker: ^8.1.2

  # Avatar 3D (Fase 6): visor de modelos .glb/.gltf con animaciones LSC
  model_viewer_plus: ^1.10.0

  # Almacenamiento seguro de tokens (nunca en texto plano)
  flutter_secure_storage: ^9.2.2

  # Navegación
  go_router: ^14.2.0

  # Modelos inmutables / serialización
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilidades
  equatable: ^2.0.5
  intl: ^0.19.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  # Los assets (fuentes, avatar 3D, animaciones LSC) se agregan a partir
  # de la Fase 6. Se deja la sección lista para no reestructurar después.
  # assets:
  #   - assets/images/
  #   - assets/avatar/
